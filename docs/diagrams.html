<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Diagram — Unduh Video</title>
<style>

  p { color: #9a9aa3; max-width: 70ch; }
  .diagram { background: #17171a; border: 1px solid #2a2a2e; border-radius: 12px; padding: 24px; overflow-x: auto; }
  svg text { font-family: sans-serif; }

</head>
<body>
<h1>Diagram — Unduh Video</h1>
<p>Alur request dan struktur repo (SVG murni — tanpa Mermaid).</p>

<div class="diagram">

    <text x="285" y="167" fill="#9a9aa3" text-anchor="middle">_worker.js</text>

    <rect x="420" y="30" width="170" height="64" rx="10" fill="#1f1f23" stroke="#2a2a2e"/>

    <rect x="420" y="120" width="170" height="64" rx="10" fill="#1f1f23" stroke="#2a2a2e"/>
    <text x="505" y="147" fill="#f4f4f2" text-anchor="middle" font-weight="700">/api/demo · /api/status</text>
    <text x="505" y="167" fill="#9a9aa3" text-anchor="middle">data contoh (demo:true)</text>

    <rect x="420" y="210" width="170" height="64" rx="10" fill="#1f1f23" stroke="#2a2a2e"/>
    <text x="505" y="237" fill="#f4f4f2" text-anchor="middle" font-weight="700">/api/download?url=…</text>
    <text x="505" y="257" fill="#9a9aa3" text-anchor="middle">validasi host video</text>

    <rect x="650" y="210" width="150" height="64" rx="10" fill="#1f1f23" stroke="#25f4ee"/>
    <text x="725" y="237" fill="#f4f4f2" text-anchor="middle" font-weight="700">savett.cc</text>
    <text x="725" y="257" fill="#9a9aa3" text-anchor="middle">GET csrf → POST url</text>

    <rect x="650" y="120" width="150" height="64" rx="10" fill="#1f1f23" stroke="#2a2a2e"/>
    <text x="725" y="147" fill="#f4f4f2" text-anchor="middle" font-weight="700">JSON hasil</text>
    <text x="725" y="167" fill="#9a9aa3" text-anchor="middle">nowm / wm / mp3 / slides</text>
  </g>
  <!-- arrows -->
  <g stroke="#9a9aa3" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="150" y1="152" x2="210" y2="152"/>
    <line x1="360" y1="140" x2="420" y2="80"/>
    <line x1="360" y1="152" x2="420" y2="152"/>
    <line x1="360" y1="164" x2="420" y2="228"/>
    <line x1="590" y1="242" x2="650" y2="242"/>
    <line x1="725" y1="210" x2="725" y2="184"/>
  </g>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9aa3"/></marker></defs>
  <text x="20" y="320" fill="#9a9aa3" font-size="13">Frontend mengunduh file lewat fetch blob (referrerPolicy: no-referrer) langsung dari CDN — bukan lewat worker.</text>
</svg>
</div>
